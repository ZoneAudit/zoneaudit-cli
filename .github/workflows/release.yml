name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # publish the GitHub release
  id-token: write # cosign keyless signing with the workflow's OIDC identity

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install syft (SBOMs)
        uses: anchore/sbom-action/download-syft@v0

      - name: Install cosign (signing)
        uses: sigstore/cosign-installer@v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. When this secret is absent, the Homebrew cask and Scoop
          # manifest are still generated (see the artefact below) but not pushed.
          PACKAGES_TOKEN: ${{ secrets.ZONEAUDIT_PACKAGES_TOKEN }}

      - name: Verify the checksum signature
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt

      - name: Keep the generated package manifests
        uses: actions/upload-artifact@v7
        with:
          name: package-manifests
          path: |
            dist/homebrew/
            dist/scoop/
          if-no-files-found: warn
